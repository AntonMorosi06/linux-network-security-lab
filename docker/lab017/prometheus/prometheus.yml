global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "lab017_observable_api"
    static_configs:
      - targets: ["observable_api:8901"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
